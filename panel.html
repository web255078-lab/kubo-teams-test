<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>KUBO</title><style>
:root{--bg:#F6F9FC;--card:#FFFFFF;--line:#DCE6EF;--text:#1F2D3A;--dim:#5F7385;--faint:#93A4B3;--accent:#2C92D5;--title:#1B5E8A;
  --ok:#3E9A47;--warn:#C9761C;--bad:#C24A4A}
@media (prefers-color-scheme: dark){:root{--bg:#1B1B1B;--card:#262626;--line:#3A3A3A;--text:#EDEDED;--dim:#B5B5B5;--faint:#8A8A8A;
  --accent:#4FA8E3;--title:#8CC6EE}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
  font-size:14px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
html:lang(zh) body{font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
html:lang(ko) body{font-family:"Malgun Gothic","Segoe UI",system-ui,sans-serif}
.hidden{display:none !important}
header{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px}
.st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-height:26px}
.st #status{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--ok)}.dot.stopped,.dot.retry{background:var(--warn)}.dot.error{background:var(--bad)}.dot.ended{background:var(--faint)}
.dot.wait{background:var(--accent);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.hint{font-size:12.5px;color:var(--dim);margin-top:4px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.btn,select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;
  font-size:13px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.icon{padding:3px 8px;font-size:15px;line-height:1.2}
label.lg{font-size:12.5px;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
#scroll{flex:1;overflow-y:auto;padding:8px 10px 60px}
.row{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row .t{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.row .src,.row .tr{white-space:pre-wrap;word-break:break-word;user-select:text}
.row .tr{color:var(--title);font-weight:600}
.row .tr.solo{color:var(--text);font-weight:400}
.row .tr.draft{color:var(--faint);font-weight:400}
.row .tag{font-size:11px;border:1px solid var(--faint);border-radius:8px;padding:0 6px;margin-right:6px}
.topic{margin:14px 0 2px;padding:5px 9px;border-radius:6px;background:rgba(44,146,213,.14);border-left:4px solid var(--accent);
  color:var(--title);font-weight:600}
.sesline{margin:16px 0 4px;display:flex;align-items:center;gap:8px;color:var(--warn);font-size:12.5px;font-weight:600}
.sesline::before,.sesline::after{content:"";flex:1;height:1px;background:var(--warn);opacity:.5}
.empty{color:var(--faint);padding:28px 6px;text-align:center}
#sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;user-select:text}
#sum .sh{font-weight:700;color:var(--title);margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
#sum .sh:first-child{margin-top:0;padding-top:0;border-top:0}
#sum .sl{white-space:pre-wrap;word-break:break-word;min-height:1.2em}
#gist{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;user-select:text}
#gist .sh{font-weight:700;color:var(--title);margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
#gist .sh:first-child{margin-top:0;padding-top:0;border-top:0}
#gist .g{display:grid;grid-template-columns:44px 1fr;gap:0 8px;padding:5px 0}
#gist .g .t{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding-top:3px}
#gist .g .x{white-space:pre-wrap;word-break:break-word}
#latest{position:fixed;right:14px;bottom:14px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1F2D3A;color:#fff;border-radius:16px;
  padding:6px 14px;font-size:13px;max-width:90%}
#err{padding:22px 14px;color:var(--text)}
#err .btn{margin-top:14px}
</style></head><body>
<header>
  <div class="st"><span class="dot wait" id="dot"></span><span id="status"></span>
    <button class="btn hidden" id="retry" data-t="reconnect"></button>
    <button class="btn icon" id="reload">&#8635;</button></div>
  <div class="hint hidden" id="hint"></div>
  <div class="bar" id="bar">
    <div class="seg" id="tabs"><button data-tab="cap" data-t="tab_cap"></button><button data-tab="gist" data-t="tab_gist"></button><button data-tab="sum" data-t="tab_sum"></button></div>
    <label class="lg hidden" id="langBox"><span data-t="lang"></span><select id="lang"></select></label>
    <div class="seg hidden" id="modes"><button data-mode="both" data-t="mode_both"></button><button data-mode="tronly" data-t="mode_tr"></button></div>
    <button class="btn" id="copy" data-t="copy"></button>
    <button class="btn" id="copyAll" data-t="copy_all"></button>
  </div>
</header>
<div id="scroll">
  <div id="err" class="hidden"><div id="errText"></div></div>
  <section id="capView"><div id="rows"></div><div class="empty" id="capEmpty"></div></section>
  <section id="gistView" class="hidden"><div id="gist" class="hidden"></div><div class="empty hidden" id="gistEmpty"></div></section>
  <section id="sumView" class="hidden"><div id="sum" class="hidden"></div><div class="empty hidden" id="sumEmpty"></div></section>
</div>
<button class="btn primary hidden" id="latest" data-t="latest"></button>
<div id="toast" class="hidden"></div>
<script src="panel.js?v=878d323e3a"></script>
</body></html>

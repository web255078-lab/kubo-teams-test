<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>KUBO Live Test</title><style>body{margin:0;padding:14px;font-family:'Segoe UI','Yu Gothic UI',sans-serif;color:#1F2D3A;background:#F6F9FC;font-size:14px;line-height:1.55}
h1{font-size:16px;color:#1B5E8A;margin:0 0 8px}
.st{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px;background:#E8EEF3}
.st.ok{background:#DDF1DF;color:#1E5C25}.st.ng{background:#F8E0E0;color:#8A2A2A}.st.wait{color:#5F7385}
.card{background:#fff;border:1px solid #DCE6EF;border-radius:10px;padding:12px;margin:12px 0}
.big{font-size:38px;font-weight:700;color:#1B5E8A;font-variant-numeric:tabular-nums}
.dim{color:#5F7385;font-size:12.5px}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid #2C92D5;background:#2C92D5;color:#fff;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
#log{font-family:Consolas,monospace;font-size:11.5px;color:#5F7385;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
@media (prefers-color-scheme: dark){body{background:#12181E;color:#E6EDF3}.card{background:#1B242D;border-color:#2C3A47}.st{background:#24303B}h1,.big{color:#8CC6EE}}</style></head><body>
<h1>KUBO 更新テスト / Live update test</h1>
<div class="st wait" id="s1">… Teams</div>
<div class="st wait" id="s2">… この PC の中 / this PC</div>
<div class="st wait" id="s3">… Live Share</div>
<div class="card">
  <div class="dim">届いた値（時刻）/ Value received (time)</div>
  <div class="big" id="val">--:--:--</div>
  <div class="dim">通し番号 / Sequence: <b id="seq">-</b></div>
  <div class="dim">出どころ / From: <span id="from">-</span></div>
  <div class="dim">この画面に届いた時刻 / Arrived here at: <span id="got">-</span></div>
</div>
<div class="dim" id="role"></div>
<p><button id="send" disabled>試しに値を送る / Send a test value</button></p>
<div class="dim">会議の中身は流していません。時刻と番号だけです。/ No meeting content. Time and a number only.</div>
<div class="card"><div class="dim">記録 / Log</div><div id="log"></div></div>
<script src="panel.js"></script>
</body></html>
